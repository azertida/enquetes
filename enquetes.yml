name: "Enquêtes — mise à jour quotidienne"

"on":
  schedule:
    - cron: '31 5 * * *'
    - cron: '52 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer la grille Pickx (nouvelle API tv.pickx.be)
        # S'arrête en erreur si la grille est vide : rien n'est publié,
        # l'appli garde les données de la veille.
        run: |
          python3 pickx_grab.py --channels=pickx_channels.xml --days=7 --output=/tmp/pickx_guide.xml

      - name: Lancer la collecte
        run: |
          python3 enquetes.py --source=/tmp/pickx_guide.xml

      - name: "Commit d'enquetes.json si modifié"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enquetes.json
          if git diff --staged --quiet; then
            echo "Aucun changement dans enquetes.json"
          else
            git commit -m "🤖 Mise à jour automatique d'Enquêtes"
            git pull --rebase origin main
            git push
          fi
